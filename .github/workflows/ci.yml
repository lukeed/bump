name: CI

on: [push, pull_request]

jobs:
  test:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install
        run: bun install

      - name: Compiles
        run: bun run build

      - name: Type Check
        run: bun run types

      - name: Test
        run: bun test
